<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Claus 2027 - System & Game Environment</title>
    <style>
        body {
            background-color: #06080f;
            color: #00ffcc;
            font-family: monospace;
            padding: 15px;
            margin: 0;
            text-align: center;
        }
        .os-container {
            max-width: 600px;
            margin: 0 auto;
            background: #0d1322;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0,255,204,0.25);
        }
        .os-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff3366;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .os-header h2 {
            color: #ff3366;
            margin: 0;
            font-size: 16px;
        }
        .status-badge {
            background: #00ffcc;
            color: #06080f;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
        }
        canvas {
            background: #000;
            border: 2px solid #ff3366;
            border-radius: 6px;
            display: block;
            margin: 10px auto;
            width: 100%;
            max-width: 540px;
            height: 220px;
        }
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .ps-btn {
            background-color: #1a2639;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .ps-btn:hover {
            background-color: #00ffcc;
            color: #06080f;
        }
        .exit-btn {
            border-color: #ff3366;
            color: #ff3366;
        }
        .exit-btn:hover {
            background-color: #ff3366;
            color: #fff;
        }
        #status-msg {
            color: #ffcc00;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="os-container">
        <div class="os-header">
            <h2>System Environment OS</h2>
            <div class="status-badge">ACTIVE v14.00</div>
        </div>

        <p style="font-size: 12px; color: #aaa; margin: 5px 0;">Codename: Santa Claus 2027 | لعبة 2D تعمل مباشرة</p>

        <!-- شاشة عرض اللعبة -->
        <canvas id="gameCanvas" width="540" height="220"></canvas>

        <div id="status-msg">حالة اللعبة: تعمل (Active) - اضغط [X] للقفز</div>

        <!-- أزرار التحكم الخاصة بالـ PS4 واللعبة -->
        <div class="controls-bar">
            <button class="ps-btn" onclick="jumpAction()">[X] قفز (Jump)</button>
            <button class="ps-btn" onclick="togglePause()">[Options] توقف مؤقت (Pause)</button>
            <button class="ps-btn exit-btn" onclick="exitGame()">[Circle] خروج (Exit)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isPaused = false;
        let score = 0;

        // إخصائص اللاعب (شخصية 2D)
        let player = {
            x: 50,
            y: 155,
            width: 25,
            height: 25,
            color: '#00ffcc',
            dy: 0,
            jumpPower: -9,
            gravity: 0.5,
            grounded: false
        };

        // العقبة
        let obstacle = {
            x: 540,
            y: 160,
            width: 18,
            height: 20,
            speed: 4,
            color: '#ff3366'
        };

        function jumpAction() {
            if (player.grounded && !isPaused) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('status-msg').innerText = isPaused ? "حالة اللعبة: متوقفة مؤقتاً (Paused)" : "حالة اللعبة: تعمل (Active)";
        }

        function exitGame() {
            isPaused = true;
            document.getElementById('status-msg').innerText = "تم إيقاف اللعبة والعودة لواجهة النظام (Exited)";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3366";
            ctx.font = "16px monospace";
            ctx.fillText("System Environment - Game Closed", 90, 115);
        }

        // تفاعل لوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === 'ArrowUp') jumpAction();
            if (e.key === 'p' || e.key === 'P') togglePause();
            if (e.key === 'Escape') exitGame();
        });

        function update() {
            if (!isPaused) {
                player.dy += player.gravity;
                player.y += player.dy;

                // الأرضية
                if (player.y > 155) {
                    player.y = 155;
                    player.dy = 0;
                    player.grounded = true;
                }

                // حركة العقبة
                obstacle.x -= obstacle.speed;
                if (obstacle.x < -20) {
                    obstacle.x = 540;
                    score += 5;
                    obstacle.speed += 0.15; // تزيد السرعة تدريجياً
                }

                // اصطدام
                if (
                    player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y
                ) {
                    score = 0;
                    obstacle.speed = 4;
                    obstacle.x = 540;
                }
            }
        }

        function draw() {
            // مسح الشاشة
            ctx.fillStyle = '#06080f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم خط الأرض
            ctx.strokeStyle = '#223452';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 180);
            ctx.lineTo(540, 180);
            ctx.stroke();

            // رسم اللاعب
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // رسم العقبة
            ctx.fillStyle = obstacle.color;
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            // رسم النقاط
            ctx.fillStyle = '#00ffcc';
            ctx.font = '13px monospace';
            ctx.fillText(`Score: ${score}`, 25, 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
  </html>
